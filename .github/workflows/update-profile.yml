name: Update GitHub profile projects

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: update-github-profile-projects
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Test the updater
        run: node --test .github/scripts/update-profile.test.mjs

      - name: Find and add new public projects
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_OWNER: Kirill-Chistov
        run: node .github/scripts/update-profile.mjs

      - name: Publish README changes directly
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update profile with new projects"
          git pull --rebase origin main
          git push origin HEAD:main
